name: Morning Wire

on:
  schedule:
    - cron: '0 10 * * *'  # 5:00 AM EST = 10:00 AM UTC (buffer for GitHub delays)
  workflow_dispatch:       # manual trigger button in GitHub

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Search and write digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date -u -d '5 hours ago' +%Y-%m-%d)
          TODAY_DISPLAY=$(date -u -d '5 hours ago' +"%B %-d, %Y")
          MONTH=$(date -u -d '5 hours ago' +%Y-%m)

          claude --print --model haiku -p "
          Today is ${TODAY_DISPLAY}. MONTH=${MONTH}. TODAY=${TODAY}.
          Read guidelines/generation-instructions.md, then do steps 1-2 and 4-6.
          Create the digest page and update index/manifest.
          Do NOT create story pages yet. Just the digest and metadata.
          " --allowedTools "WebSearch,Read,Write,Edit,Bash,Glob"

      - name: Generate story pages with diagrams
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date -u -d '5 hours ago' +%Y-%m-%d)
          MONTH=$(date -u -d '5 hours ago' +%Y-%m)

          claude --print --model sonnet -p "
          Read guidelines/generation-instructions.md and guidelines/diagram-guidelines.md.
          Read the digest at digests/${MONTH}/${TODAY}.html.
          Do step 3 only: create story pages in digests/${MONTH}/${TODAY}/ for every story linked from the digest.
          Every page MUST have at least one rough.js diagram. Follow diagram guidelines exactly.
          Check digests/manifest.json for cross-links by tag.
          " --allowedTools "Read,Write,Edit,Bash,Glob"

      - name: Commit and push
        run: |
          git config user.name "Morning Wire Bot"
          git config user.email "bot@morningwire.local"
          git add digests/
          git diff --staged --quiet || git commit -m "digest: $(date -u -d '5 hours ago' +%Y-%m-%d)"
          git push
