// ── Shared helper ──
function makeMap(containerId, infoId, width, height, projection, dataUrl, objKeyFn, nameFn, lookupData) {
  var svg = d3.select('#' + containerId).append('svg')
    .attr('width', width).attr('height', height)
    .attr('style', 'display:block; margin: 20px 0; border: 1px solid #ccc;');
  var path = d3.geoPath().projection(projection);
  var selected = null;

  d3.json(dataUrl).then(function(topo) {
    var objKey = objKeyFn(topo);
    var features = topojson.feature(topo, topo.objects[objKey]).features;

    svg.selectAll('path.region')
      .data(features)
      .enter().append('path')
      .attr('class', 'region')
      .attr('d', path)
      .attr('fill', '#e8e8e8')
      .attr('stroke', '#999')
      .attr('stroke-width', 0.5)
      .attr('cursor', 'pointer')
      .on('mouseover', function() {
        if (this !== selected) d3.select(this).attr('fill', '#d0d0d0');
      })
      .on('mouseout', function() {
        if (this !== selected) d3.select(this).attr('fill', '#e8e8e8');
      })
      .on('click', function(event, d) {
        svg.selectAll('path.region').attr('fill', '#e8e8e8');
        if (selected === this) {
          selected = null;
          document.getElementById(infoId).textContent = '';
          return;
        }
        selected = this;
        d3.select(this).attr('fill', '#888');
        var name = nameFn(d);
        var info = document.getElementById(infoId);
        var data = lookupData[name];
        if (data) {
          var parts = '<b>' + name + '</b>.';
          if (data.capital) parts += ' Capital: ' + data.capital + '.';
          if (data.lang) parts += ' Language: ' + data.lang + '.';
          info.innerHTML = parts;
        } else {
          info.innerHTML = '<b>' + name + '</b>.';
        }
      });

    svg.append('path')
      .datum(topojson.mesh(topo, topo.objects[objKey], function(a, b) { return a !== b; }))
      .attr('fill', 'none')
      .attr('stroke', '#999')
      .attr('stroke-width', 0.5)
      .attr('d', path)
      .attr('pointer-events', 'none');
  });
}

// Middle East uses world-atlas but zoomed into the region
(function() {
  var width = 600, height = 450;
  var svg = d3.select('#mideast-map').append('svg')
    .attr('width', width).attr('height', height)
    .attr('style', 'display:block; margin: 20px 0; border: 1px solid #ccc;');

  var projection = d3.geoMercator()
    .center([50, 28])
    .scale(600)
    .translate([width / 2, height / 2]);

  var path = d3.geoPath().projection(projection);
  var selected = null;

  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(function(world) {
    var allCountries = topojson.feature(world, world.objects.countries).features;

    // Filter to Middle East region by bounding box + name match
    var meCountries = allCountries.filter(function(f) {
      var name = f.properties.name;
      if (middleEastNames.indexOf(name) >= 0) return true;
      // Also include by centroid location (roughly 25-45E, 10-42N)
      if (!f.geometry) return false;
      var c = d3.geoCentroid(f);
      return c[0] > 24 && c[0] < 75 && c[1] > 10 && c[1] < 42;
    });

    // Draw neighboring context countries lightly
    allCountries.forEach(function(f) {
      if (!f.geometry) return;
      var c = d3.geoCentroid(f);
      if (c[0] > 10 && c[0] < 85 && c[1] > 0 && c[1] < 50) {
        svg.append('path')
          .datum(f)
          .attr('d', path)
          .attr('fill', '#f4f4f4')
          .attr('stroke', '#ddd')
          .attr('stroke-width', 0.3)
          .attr('pointer-events', 'none');
      }
    });

    // Draw Middle East countries on top
    svg.selectAll('path.me')
      .data(meCountries)
      .enter().append('path')
      .attr('class', 'me')
      .attr('d', path)
      .attr('fill', '#e8e8e8')
      .attr('stroke', '#999')
      .attr('stroke-width', 0.5)
      .attr('cursor', 'pointer')
      .on('mouseover', function() {
        if (this !== selected) d3.select(this).attr('fill', '#d0d0d0');
      })
      .on('mouseout', function() {
        if (this !== selected) d3.select(this).attr('fill', '#e8e8e8');
      })
      .on('click', function(event, d) {
        svg.selectAll('path.me').attr('fill', '#e8e8e8');
        if (selected === this) {
          selected = null;
          document.getElementById('mideast-info').textContent = '';
          return;
        }
        selected = this;
        d3.select(this).attr('fill', '#888');
        var name = d.properties.name;
        var info = document.getElementById('mideast-info');
        var data = middleEastData[name];
        if (data) {
          info.innerHTML = '<b>' + name + '</b>. Capital: ' + data.capital + '. Language: ' + data.lang + '.';
        } else {
          info.innerHTML = '<b>' + name + '</b>.';
        }
      });
  });
})();
