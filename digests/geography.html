// ── Shared helper ──
function makeMap(containerId, infoId, width, height, projection, dataUrl, objKeyFn, nameFn, lookupData) {
  var svg = d3.select('#' + containerId).append('svg')
    .attr('width', width).attr('height', height)
    .attr('style', 'display:block; margin: 20px 0; border: 1px solid #ccc;');
  var path = d3.geoPath().projection(projection);
  var selected = null;

  d3.json(dataUrl).then(function(topo) {
    var objKey = objKeyFn(topo);
    var features = topojson.feature(topo, topo.objects[objKey]).features;

    svg.selectAll('path.region')
      .data(features)
      .enter().append('path')
      .attr('class', 'region')
      .attr('d', path)
      .attr('fill', '#e8e8e8')
      .attr('stroke', '#999')
      .attr('stroke-width', 0.5)
      .attr('cursor', 'pointer')
      .on('mouseover', function() {
        if (this !== selected) d3.select(this).attr('fill', '#d0d0d0');
      })
      .on('mouseout', function() {
        if (this !== selected) d3.select(this).attr('fill', '#e8e8e8');
      })
      .on('click', function(event, d) {
        svg.selectAll('path.region').attr('fill', '#e8e8e8');
        if (selected === this) {
          selected = null;
          document.getElementById(infoId).textContent = '';
            return;
        }
        selected = this;
        d3.select(this).attr('fill', '#888');
        var name = nameFn(d);
        var info = document.getElementById(infoId);
        var data = lookupData[name];
        if (data) {
          var html = '<b>' + name + '</b><br>';
          if (data.capital) html += 'Capital: ' + data.capital + '<br>';
          if (data.lang) html += 'Language: ' + data.lang + '<br>';
          if (data.desc) html += '<br>' + data.desc + '<br>';
          html += '<br><a href="https://www.earth.google.com/web/search/' + encodeURIComponent(name) + '" target="_blank">view on Google Earth</a>';
          info.innerHTML = html;
        } else {
          info.innerHTML = '<b>' + name + '</b>.<br><a href="https://www.earth.google.com/web/search/' + encodeURIComponent(name) + '" target="_blank">view on Google Earth</a>';
        }
      });

    svg.append('path')
      .datum(topojson.mesh(topo, topo.objects[objKey], function(a, b) { return a !== b; }))
      .attr('fill', 'none')
      .attr('stroke', '#999')
      .attr('stroke-width', 0.5)
      .attr('d', path)
      .attr('pointer-events', 'none');
  });
}

  'Leningrad':{capital:'Gatchina',lang:'Russian',desc:'Surrounds St. Petersburg but is a separate region. Gatchina Palace was a Romanov residence. Heavy WWII fighting along the Siege of Leningrad perimeter.'},
  'Lipetsk':{capital:'Lipetsk',lang:'Russian',desc:'Steel manufacturing center. NLMK is one of Russia\'s largest steel companies. Mineral springs and spa resorts. Central Black Earth agricultural region.'},
  'Maga Buryatdan':{capital:'Magadan',lang:'Russian',desc:'Gateway to the Kolyma region, synonymous with Gulag labor camps. "Road of Bones" highway was built by prisoners. Gold mining. Extremely harsh winters.'},
  'Magadan':{capital:'Magadan',lang:'Russian',desc:'Gateway to the Kolyma region, synonymous with Gulag labor camps. "Road of Bones" highway was built by prisoners. Gold mining. Extremely harsh winters.'},
  'Mariy-El':{capital:'Yoshkar-Ola',lang:'Russian, Mari',desc:'Mari people practice a pre-Christian nature religion alongside Orthodox Christianity. Volga region. Yoshkar-Ola has replicas of European landmarks built in the 2000s.'},
  'Mordovia':{capital:'Saransk',lang:'Russian, Moksha, Erzya',desc:'Finno-Ugric republic. Two distinct Mordvin peoples (Moksha and Erzya) with separate languages. Saransk hosted 2018 World Cup matches. Penal colonies in the region.'},
  'Moscow':{capital:'Moscow',lang:'Russian',desc:'Moscow Oblast surrounds the capital. Major industrial and scientific belt. Population over 7 million. Star City cosmonaut training center is here.'},
  'Moscow City':{capital:'Moscow',lang:'Russian',desc:'Capital of Russia. Population 13 million. Kremlin, Red Square, Bolshoi Theatre. Political, economic, and cultural center. Metro system opened in 1935, known for its architecture.'},
  'Moskva':{capital:'Moscow',lang:'Russian',desc:'Capital of Russia. Population 13 million. Kremlin, Red Square, Bolshoi Theatre. Political, economic, and cultural center. Metro system opened in 1935, known for its architecture.'},
  'Murmansk':{capital:'Murmansk',lang:'Russian',desc:'Largest city above the Arctic Circle. Ice-free port thanks to the Gulf Stream. Northern Fleet headquarters. Polar night lasts 40 days in winter.'},
  'Nenets':{capital:'Naryan-Mar',lang:'Russian',desc:'Arctic tundra. Indigenous Nenets are reindeer herders. Massive natural gas reserves. Population under 45,000. One of the least accessible regions in Russia.'},
  'Nizhegorod':{capital:'Nizhny Novgorod',lang:'Russian',desc:'Third largest city in Russia. Major automotive (GAZ) and military industry. Closed city during Soviet era. Volga and Oka rivers meet here. Historic trade fair.'},
  'North Ossetia':{capital:'Vladikavkaz',lang:'Russian, Ossetic',desc:'Ossetians are descendants of the ancient Alans. Beslan school siege (2004) killed 334 people, mostly children. Gateway to the Caucasus Mountains.'},
  'Novgorod':{capital:'Veliky Novgorod',lang:'Russian',desc:'One of the oldest cities in Russia. Novgorod Republic was a medieval trading power. Birch bark letters from the 11th century found here. UNESCO World Heritage sites.'},
  'Novosibirsk':{capital:'Novosibirsk',lang:'Russian',desc:'Third largest city in Russia. Akademgorodok is a major science hub built in the 1950s. Trans-Siberian Railway. Largest city in Siberia.'},
  'Omsk':{capital:'Omsk',lang:'Russian',desc:'Dostoevsky served four years of hard labor here. Major petrochemical industry. Irtysh River. Was briefly the capital of anti-Bolshevik White Russia in 1918-19.'},
  'Orel':{capital:'Oryol',lang:'Russian',desc:'Birthplace of writers Turgenev and Bunin. Battle of Kursk extended into this region. Agricultural center in the Central Black Earth zone.'},

  'Perm\'':{capital:'Perm',lang:'Russian',desc:'Ural Mountains. The Permian geological period is named after this city. Gulag museum at Perm-36. Major industrial and chemical production.'},

  'Pskov':{capital:'Pskov',lang:'Russian',desc:'One of Russia\'s oldest cities. Pskov Republic was independent for centuries. Nicholas II abdicated at a railway station in Pskov in 1917. Borders Estonia and Latvia.'},
  'Rostov':{capital:'Rostov-on-Don',lang:'Russian',desc:'Gateway to the Caucasus. Major Don River port. Cossack heartland. Sholokhov wrote "And Quiet Flows the Don" about this region. 2018 World Cup host city.'},
  'Ryazan\'':{capital:'Ryazan',lang:'Russian',desc:'Medieval principality. Airborne forces training center. Poet Sergei Yesenin was born here. Rich agricultural land south of Moscow.'},
  'Sakha':{capital:'Yakutsk',lang:'Russian, Yakut',desc:'Largest subnational entity in the world, bigger than Argentina. Yakutsk is the coldest major city on Earth (minus 50C in winter). Diamond mining capital. Permafrost covers everything.'},
  'Sakhalin':{capital:'Yuzhno-Sakhalinsk',lang:'Russian',desc:'Island off the Pacific coast. Split between Russia and Japan until 1945. Major oil and gas (Sakhalin-1 and Sakhalin-2 projects). Chekhov wrote about the penal colony here.'},
  'Samara':{capital:'Samara',lang:'Russian',desc:'Space industry center. Soyuz rockets are manufactured here. Was the secret backup capital of the USSR in WWII. Volga River city. Zhiguli Mountains nearby.'},
  'Saratov':{capital:'Saratov',lang:'Russian',desc:'Gagarin landed near Saratov after the first human spaceflight in 1961. Volga German community lived here until WWII deportation. Major university city.'},
  'Sevastopol':{capital:'Sevastopol',lang:'Russian',desc:'Annexed from Ukraine in 2014. Home of Russia\'s Black Sea Fleet since 1783. Heroic defense during WWII. Internationally recognized as part of Ukraine.'},
  'Smolensk':{capital:'Smolensk',lang:'Russian',desc:'Fought over in every major invasion of Russia. Napoleon passed through in 1812. Devastating WWII battles. Polish president\'s plane crashed near here in 2010.'},
  'Stavropol\'':{capital:'Stavropol',lang:'Russian',desc:'Mikhail Gorbachev was born and raised here. North Caucasus mineral spa towns (Mineralnye Vody, Pyatigorsk). Lermontov was killed in a duel at Pyatigorsk.'},
  'Sverdlovsk':{capital:'Yekaterinburg',lang:'Russian',desc:'Romanov royal family was executed here in 1918. Fourth largest city in Russia. Boris Yeltsin\'s political base. Major Ural Mountains industrial center.'},
  'Tambov':{capital:'Tambov',lang:'Russian',desc:'Site of the Tambov Rebellion (1920-21) against Bolshevik grain seizures. Agricultural region. Known for Tambov ham and wolf folklore.'},
  'Tatarstan':{capital:'Kazan',lang:'Russian, Tatar',desc:'Tatar majority republic. Kazan Kremlin is a UNESCO site. Oil-rich. Negotiated special autonomy from Moscow in the 1990s. Hosted 2013 Universiade and 2018 World Cup.'},
  'Tomsk':{capital:'Tomsk',lang:'Russian',desc:'University city since 1878. Oldest university in Siberia. Wooden architecture preserved in the old town. Scientific and tech hub.'},
  'Tula':{capital:'Tula',lang:'Russian',desc:'Arms manufacturing since the 16th century. Famous for samovars and pryaniki (gingerbread). Tolstoy\'s estate Yasnaya Polyana is nearby. Defended Moscow in 1941.'},
  'Tuva':{capital:'Kyzyl',lang:'Russian, Tuvan',desc:'Geographic center of Asia (monument in Kyzyl). Buddhist and shamanist traditions. Tuvan throat singing is world-famous. Joined Russia only in 1944. Remote and mountainous.'},
  'Tver\'':{capital:'Tver',lang:'Russian',desc:'Sits between Moscow and St. Petersburg. Medieval rival to Moscow for supremacy. Volga River\'s source is in Tver Oblast. Major railway corridor.'},
  'Tyumen\'':{capital:'Tyumen',lang:'Russian',desc:'First Russian city in Siberia, founded 1586. Vast oil and gas reserves. One of the wealthiest regions per capita. Covers a huge area extending to the Arctic.'},
  'Udmurt':{capital:'Izhevsk',lang:'Russian, Udmurt',desc:'Kalashnikov (AK-47) was designed and produced in Izhevsk. Finno-Ugric republic. Arms manufacturing center since the 19th century.'},
  'Ul\'yanovsk':{capital:'Ulyanovsk',lang:'Russian',desc:'Birthplace of Lenin (born Vladimir Ulyanov). Renamed from Simbirsk in his honor. Volga River city. Aircraft manufacturing (Aviastar).'},
  'Vladimir':{capital:'Vladimir',lang:'Russian',desc:'Golden Ring city. Was the capital of medieval Russia before Moscow. 12th-century white-stone cathedrals are UNESCO sites. Ancient seat of Russian Orthodoxy.'},
  'Volgograd':{capital:'Volgograd',lang:'Russian',desc:'Formerly Stalingrad. The Battle of Stalingrad (1942-43) was the deadliest battle in history. The Motherland Calls statue is 85 meters tall. Volga River industrial city.'},
  'Vologda':{capital:'Vologda',lang:'Russian',desc:'Famous for Vologda butter and lace. Kremlin built by Ivan the Terrible. Northern Russian cultural center. Many wooden churches and monasteries.'},
  'Voronezh':{capital:'Voronezh',lang:'Russian',desc:'Peter the Great built Russia\'s first navy here. Major WWII battle site. Aerospace industry. One of the largest cities in southern Russia.'},
  'Yamal-Nenets':{capital:'Salekhard',lang:'Russian',desc:'Produces the majority of Russia\'s natural gas. Nenets reindeer herders. Salekhard sits on the Arctic Circle. Gazprom\'s most important extraction region.'},
  'Yaroslavl\'':{capital:'Yaroslavl',lang:'Russian',desc:'Golden Ring city, founded 1010. One of the oldest cities in Russia. Historic center is a UNESCO site. First Russian theater was established here in 1750.'},
  'Yevrey':{capital:'Birobidzhan',lang:'Russian',desc:'Jewish Autonomous Oblast, created in 1934 as a Soviet Jewish homeland alternative to Israel. Few Jewish residents remain. Far Eastern Russia near China.'},
  'Zabaykal\'ye':{capital:'Chita',lang:'Russian',desc:'Trans-Baikal region east of Lake Baikal. Decembrist exiles were sent here. Borders Mongolia and China. Continental climate with extreme temperature swings.'},
  'Crimea':{capital:'Simferopol',lang:'Russian, Ukrainian, Crimean Tatar',desc:'Annexed from Ukraine by Russia in 2014, internationally disputed. Black Sea peninsula. Sevastopol naval base. Yalta Conference (1945) shaped the post-WWII world order.'},
};

  'Manitoba':{capital:'Winnipeg',lang:'English, French',desc:'Geographic center of Canada. Churchill is the "polar bear capital of the world." The Red River Rebellion (1869) led to Manitoba joining Confederation. Major grain-producing province.'},

  'Newfoundland and Labrador':{capital:'St. John\'s',lang:'English',desc:'Last province to join Canada (1949). St. John\'s is the oldest English-founded city in North America. Vikings landed at L\'Anse aux Meadows around 1000 AD. Grand Banks cod fishery collapsed in 1992.'},

  'Quebec':{capital:'Quebec City',lang:'French',desc:'Only majority French-speaking province. Nearly voted to separate from Canada in 1995 (49.4% yes). Quebec City (1608) is one of the oldest European settlements in North America. Distinct civil law system based on French law.'},
  'Saskatchewan':{capital:'Regina',lang:'English',desc:'Breadbasket of Canada. Produces more wheat than any other province. RCMP training depot is in Regina. Flat prairie landscape. Name comes from the Cree word for "swiftly flowing river."'},
  'Yukon':{capital:'Whitehorse',lang:'English, French',desc:'Klondike Gold Rush (1896) brought 100,000 prospectors. Mount Logan is the highest peak in Canada (5,959m). Population under 45,000. Named after the Yukon River.'},
};

// Canada uses GeoJSON (not TopoJSON)
(function() {
  var width = 700, height = 500;
  var svg = d3.select('#canada-map').append('svg')
    .attr('width', width).attr('height', height)
    .attr('style', 'display:block; margin: 20px 0; border: 1px solid #ccc;');

  var projection = d3.geoConicConformal()
    .center([-95, 60])
    .scale(600)
    .translate([width / 2, height / 2]);

  var path = d3.geoPath().projection(projection);
  var selected = null;

  d3.json('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/canada.geojson').then(function(geo) {
    svg.selectAll('path.region')
      .data(geo.features)
      .enter().append('path')
      .attr('class', 'region')
      .attr('d', path)
      .attr('fill', '#e8e8e8')
      .attr('stroke', '#999')
      .attr('stroke-width', 0.5)
      .attr('cursor', 'pointer')
      .on('mouseover', function() {
        if (this !== selected) d3.select(this).attr('fill', '#d0d0d0');
      })
      .on('mouseout', function() {
        if (this !== selected) d3.select(this).attr('fill', '#e8e8e8');
      })
      .on('click', function(event, d) {
        svg.selectAll('path.region').attr('fill', '#e8e8e8');
        if (selected === this) {
          selected = null;
          document.getElementById('canada-info').innerHTML = '';
          return;
        }
        selected = this;
        d3.select(this).attr('fill', '#888');
        var name = d.properties.name;
        var info = document.getElementById('canada-info');
        var data = canadaData[name];
        if (data) {
          var html = '<b>' + name + '</b><br>';
          if (data.capital) html += 'Capital: ' + data.capital + '<br>';
          if (data.lang) html += 'Language: ' + data.lang + '<br>';
          if (data.desc) html += '<br>' + data.desc + '<br>';
          html += '<br><a href="https://www.earth.google.com/web/search/' + encodeURIComponent(name + ', Canada') + '" target="_blank">view on Google Earth</a>';
          info.innerHTML = html;
        } else {
          info.innerHTML = '<b>' + name + '</b>.<br><a href="https://www.earth.google.com/web/search/' + encodeURIComponent(name + ', Canada') + '" target="_blank">view on Google Earth</a>';
        }
      });
  });
})();
</script>
